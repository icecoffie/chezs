  <body>
    <div id="root">
      <div class="veil is-up">
        <div class="veil-card">
          <p id="startup-status" class="veil-label" role="status">
            Setting up the board…
          </p>
          <div class="veil-track is-waiting">
            <span class="veil-fill"></span>
          </div>
        </div>
      </div>
    </div>
    <script>
      const showStartupFailure = (detail) => {
        const status = document.getElementById("startup-status");
        if (status)
          status.textContent = "The board could not be set up: " + detail;
      };
      window.addEventListener(
        "error",
        (event) =>
          showStartupFailure(
            event.message || event.target?.src || "a script failed to load"
          ),
        true
      );
      window.addEventListener("unhandledrejection", (event) =>
        showStartupFailure(String(event.reason))
      );
    </script>
    <script type="module" src="./app/main.js"></script>
